name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # The versions the installer sets up on the panel host.
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, intl, bcmath, gmp, sodium
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Pages render @vite, so the tests need a built manifest.
      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test --compact
